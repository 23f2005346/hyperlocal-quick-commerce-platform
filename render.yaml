# =========================================================================
# KOMAL MART — RENDER PRODUCTION BLUEPRINT (100% FREE TIER)
# Unified deployment: Vite Frontend + Flask Backend + SQLite WAL
# Free Live URL: https://komalmart.onrender.com (or https://komal-mart.onrender.com)
# =========================================================================
services:
  - type: web
    name: komalmart
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore # Closest low-latency region for Indian users (Mumbai / Singapore)
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
